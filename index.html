<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Plan de Alimentación</title>
<style>
  :root{
    --bg:#f4f6f8;
    --card:#ffffff;
    --ink:#1f2937;
    --muted:#6b7280;
    --accent:#16a34a;
    --accent-soft:#dcfce7;
    --warm:#f59e0b;
    --warm-soft:#fef3c7;
    --border:#e5e7eb;
    --done:#9ca3af;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    display:flex;
    flex-direction:column;
    height:100vh;
    height:100dvh;
    overflow:auto;
    font-size:14px;
  }

  header{
    display:flex;align-items:center;gap:14px;
    padding:10px 16px;background:var(--card);border-bottom:1px solid var(--border);
  }
  header .title{font-size:17px;font-weight:700;letter-spacing:-.2px;}
  header .subtitle{font-size:11px;color:var(--muted);margin-top:1px;}
  .week-dots{display:flex;gap:6px;margin-left:auto;align-items:center;}
  .week-dots .dot{
    width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;color:var(--muted);background:#f3f4f6;border:1px solid var(--border);cursor:pointer;
  }
  .week-dots .dot.today{border-color:var(--accent);color:var(--accent);}
  .week-dots .dot.full{background:var(--accent);border-color:var(--accent);color:#fff;}
  .week-dots .dot.partial{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
  .btn-reset{border:1px solid var(--border);background:#fff;color:var(--muted);border-radius:8px;padding:7px 12px;font-size:12px;font-weight:600;cursor:pointer;}
  .btn-reset:active{background:#f3f4f6;}

  nav.tabs{display:flex;gap:6px;padding:8px 16px 0;background:var(--card);overflow-x:auto;}
  nav.tabs button{border:1px solid var(--border);background:#fff;color:var(--muted);border-radius:10px 10px 0 0;padding:9px 13px;font-size:13px;font-weight:600;cursor:pointer;border-bottom:none;white-space:nowrap;}
  nav.tabs button.active{background:var(--bg);color:var(--ink);}
  nav.tabs button.active b{color:var(--accent);}

  /* ---------- Semana ---------- */
  #viewSemana{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--bg);}
  nav.days{display:flex;gap:6px;padding:8px 16px;overflow-x:auto;}
  nav.days button{flex:1;min-width:0;border:1px solid var(--border);background:#fff;color:var(--muted);border-radius:10px;padding:9px 4px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;}
  nav.days button.active{background:var(--accent);border-color:var(--accent);color:#fff;}

  main{flex:1;display:flex;flex-direction:column;padding:12px 16px;gap:10px;min-height:0;}
  .day-meta{display:flex;align-items:center;gap:14px;font-size:12px;color:var(--muted);}
  .day-meta b{color:var(--ink);font-size:13px;}
  .day-meta .chip{background:var(--accent-soft);color:var(--accent);padding:3px 10px;border-radius:999px;font-weight:700;font-size:12px;}

  .meals{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:minmax(0,1fr);gap:10px;min-height:0;}
  .meal-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .meal-head{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;}
  .meal-head .icon{font-size:18px;}
  .meal-item{display:flex;align-items:flex-start;gap:10px;background:#fafafa;border:1px solid var(--border);border-radius:10px;padding:10px;cursor:pointer;user-select:none;transition:background .15s;}
  .meal-item:active{background:#f0f0f0;}
  .meal-item .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--accent);flex:0 0 auto;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;font-weight:800;transition:background .15s;}
  .meal-item.done{opacity:.55;}
  .meal-item.done .text{text-decoration:line-through;color:var(--done);}
  .meal-item.done .box{background:var(--accent);}
  .meal-item .text{font-size:12.5px;line-height:1.35;color:var(--ink);}

  footer{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--card);border-top:1px solid var(--border);}
  .extra{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;cursor:pointer;user-select:none;padding:8px 12px;border:1px solid var(--border);border-radius:10px;background:#fff;}
  .extra .box{width:20px;height:20px;border-radius:6px;border:2px solid var(--warm);display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;font-weight:800;}
  .extra.on .box{background:var(--warm);}
  .progress-wrap{flex:1;display:flex;flex-direction:column;gap:4px;}
  .progress-wrap .label{font-size:11px;color:var(--muted);font-weight:600;}
  .bar{height:10px;background:#eef0f2;border-radius:999px;overflow:hidden;}
  .bar .fill{height:100%;background:linear-gradient(90deg,#22c55e,#16a34a);border-radius:999px;transition:width .3s;}
  .pct{font-size:13px;font-weight:700;color:var(--accent);min-width:44px;text-align:right;}

  /* ---------- Ingredientes & Compras & Recetas ---------- */
  #viewIngredientes, #viewCompras, #viewRecetas{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px;display:none;}
  .ing-section{margin-bottom:14px;}
  .ing-section h2{font-size:14px;font-weight:700;margin-bottom:8px;color:var(--ink);}
  .ing-box{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
  .ing-row{display:flex;align-items:center;gap:12px;padding:11px 12px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;}
  .ing-row:last-child{border-bottom:none;}
  .ing-row .ing-info{flex:1;min-width:0;}
  .ing-row .ing-name{font-weight:700;font-size:14px;}
  .ing-row .ing-name .muted{color:var(--muted);font-weight:600;font-size:12px;}
  .ing-row .ing-alts{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .ing-row.off .ing-name{color:var(--done);text-decoration:line-through;}
  .switch{width:42px;height:24px;border-radius:999px;background:#e5e7eb;flex:0 0 auto;position:relative;transition:background .2s;}
  .switch .knob{width:20px;height:20px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;transition:left .2s;box-shadow:0 1px 2px rgba(0,0,0,.2);}
  .switch.on{background:var(--accent);}
  .switch.on .knob{left:20px;}
  .ing-row.stock{cursor:default;}
  .ing-row.stock .ing-alts{color:#b45309;font-weight:600;}
  .tip{background:var(--accent-soft);border:1px solid #bbf7d0;border-radius:10px;padding:10px 12px;font-size:12.5px;color:#166534;}
  .tip b{color:#14532d;}

  .block-card{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:12px;padding:12px;margin-bottom:8px;}
  .block-card .b-title{font-weight:700;font-size:13.5px;margin-bottom:4px;}
  .block-card .b-sub{font-size:12px;color:var(--muted);line-height:1.4;}
  .recipe{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px;}
  .recipe .r-head{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;}
  .recipe .r-tag{font-size:10px;font-weight:800;padding:2px 8px;border-radius:999px;margin-left:auto;white-space:nowrap;letter-spacing:.3px;}
  .recipe .r-tag.prep{background:var(--accent-soft);color:var(--accent);}
  .recipe .r-tag.diario{background:var(--warm-soft);color:#b45309;}
  .recipe .r-days{font-size:11.5px;color:var(--muted);margin:3px 0 6px;}
  .recipe ol{margin:2px 0 0 18px;font-size:12.5px;line-height:1.45;color:var(--ink);}
  .recipe ol li{margin-bottom:2px;}
  .recipe .r-note{font-size:11.5px;color:var(--muted);font-style:italic;margin-top:6px;}

  @media (max-width:760px){
    .meals{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>
<body>
  <header>
    <div>
      <div class="title">🥗 Plan de Alimentación</div>
      <div class="subtitle">Seguimiento semanal</div>
    </div>
    <div class="week-dots" id="weekDots"></div>
    <button class="btn-reset" onclick="resetWeek()">↺ Reiniciar semana</button>
  </header>

  <nav class="tabs">
    <button id="tabSemana" class="active" onclick="showView('semana')">📅 <b>Semana</b></button>
    <button id="tabRecetas" onclick="showView('recetas')">👩‍🍳 <b>Recetas</b></button>
    <button id="tabIng" onclick="showView('ingredientes')">🥕 <b>Ingredientes</b></button>
    <button id="tabCompras" onclick="showView('compras')">🛒 <b>Compras</b></button>
  </nav>

  <div id="viewSemana">
    <nav class="days" id="dayNav"></nav>
    <main>
      <div class="day-meta" id="dayMeta"></div>
      <div class="meals" id="meals"></div>
    </main>
    <footer>
      <div class="extra" id="extraPsyllium" onclick="toggleDaily('psyllium')">
        <div class="box">✓</div>
        <span>💧 12 g de chía en agua</span>
      </div>
      <div class="extra" id="extraGym" onclick="toggleDaily('gym')">
        <div class="box">✓</div>
        <span>🏋️ Extra gimnasio: 1 tortilla + 20 g maní</span>
      </div>
      <div class="progress-wrap">
        <div class="label" id="progLabel">Progreso del día</div>
        <div class="bar"><div class="fill" id="progFill" style="width:0%"></div></div>
      </div>
      <div class="pct" id="progPct">0%</div>
    </footer>
  </div>

  <div id="viewRecetas">
    <div id="recetasList"></div>
  </div>

  <div id="viewIngredientes">
    <div class="tip" style="margin-bottom:14px;">
      <b>Activa/desactiva</b> lo que tienes. Si un ingrediente está apagado, el menú lo cambia solo por una de sus alternativas.
    </div>
    <div id="ingList"></div>
  </div>

  <div id="viewCompras">
    <div id="comprasList"></div>
  </div>

   steps:["Lava y corta justo antes de comer."]},
  {name:"Chía en agua", tag:"diario",
   days:"todos los días",
   note:"Fuente de fibra; se toma al momento.",
   steps:["12 g de chía en un vaso grande de agua.","Deja reposar 5 min (se forma gel), revuelve y toma."]},
  {name:"Yogur + chía", tag:"diario",
   days:"meriendas / desayunos",
   note:"Puedes dejar la chía remojando la noche anterior; arma el resto fresco.",
   steps:["Sirve el yogur.","Añade chía/linaza y fruta al momento."]}
];

const DAY_KEYS = ["lunes","martes","miercoles","jueves","viernes","sabado","domingo"];
const CORE_COUNT = 5;
const STORE_KEY = "plan-alimentacion-v2";
const ING_STORE = "plan-alimentacion-ing";

let currentDay = DAY_KEYS[0];
let state = load();
let ing = loadIng();

function load(){
  try{ const raw = localStorage.getItem(STORE_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  const s = {};
  DAY_KEYS.forEach(d => s[d] = {desayuno:false,almuerzo:false,merienda:false,cena:false,psyllium:false,gym:false});
  return s;
}
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }

function loadIng(){
  const o = {};
  Object.keys(INGREDIENTS).forEach(k => o[k] = INGREDIENTS[k].on);
  try{
    const raw = localStorage.getItem(ING_STORE);
    if(raw){ const saved = JSON.parse(raw); Object.keys(saved).forEach(k => { if(k in o) o[k] = !!saved[k]; }); }
  }catch(e){}
  return o;
}
function saveIng(){ try{ localStorage.setItem(ING_STORE, JSON.stringify(ing)); }catch(e){} }

function altName(a){ return INGREDIENTS[a] ? INGREDIENTS[a].name : a; }
function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

function resolve(text){
  const used = new Set();
  return text.replace(/\[(\w+)\]/g, (m, key) => {
    if(!INGREDIENTS[key]) return m;
    const g = INGREDIENTS[key];
    const candidates = [];
    if(ing[key]) candidates.push(g.name);
    for(const a of g.alts){
      if(!INGREDIENTS[a]) candidates.push(a);
      else if(ing[a]) candidates.push(INGREDIENTS[a].name);
    }
    for(const c of candidates){
      if(!used.has(c.toLowerCase())){ used.add(c.toLowerCase()); return c; }
    }
    const fallback = candidates[0] || altName(g.alts[0]) || g.name;
    used.add(fallback.toLowerCase());
    return fallback;
  });
}

function todayKey(){ return DAY_KEYS[(new Date().getDay() + 6) % 7]; }
function dayProgress(d){
  const s = state[d]; let done = 0;
  MEAL_ORDER.forEach(m => { if(s[m]) done++; });
  if(s.psyllium) done++;
  return {done, total:CORE_COUNT};
}

function renderNav(){
  const nav = document.getElementById("dayNav");
  nav.innerHTML = "";
  DAY_KEYS.forEach(k => {
    const b = document.createElement("button");
    b.textContent = PLAN[k].n;
    b.className = k === currentDay ? "active" : "";
    b.onclick = () => selectDay(k);
    nav.appendChild(b);
  });
}
function renderDots(){
  const wrap = document.getElementById("weekDots");
  wrap.innerHTML = "";
  DAY_KEYS.forEach(k => {
    const d = document.createElement("div");
    d.className = "dot";
    d.textContent = PLAN[k].n[0];
    const {done,total} = dayProgress(k);
    if(done === total) d.classList.add("full");
    else if(done > 0) d.classList.add("partial");
    if(k === todayKey()) d.classList.add("today");
    d.onclick = () => selectDay(k);
    wrap.appendChild(d);
  });
}
function renderMeta(){
  const m = PLAN[currentDay].meta;
  document.getElementById("dayMeta").innerHTML =
    `<span class="chip">${PLAN[currentDay].n}</span>` +
    `<span><b>${m.kcal}</b></span>` +
    `<span><b>${m.prot}</b></span>`;
}
function renderMeals(){
  const wrap = document.getElementById("meals");
  wrap.innerHTML = "";
  MEAL_ORDER.forEach(mealKey => {
    const card = document.createElement("div");
    card.className = "meal-card";
    const done = state[currentDay][mealKey];
    card.innerHTML = `
      <div class="meal-head"><span class="icon">${MEAL_META[mealKey].icon}</span>${MEAL_META[mealKey].name}</div>
      <div class="meal-item ${done ? "done" : ""}" data-meal="${mealKey}">
        <div class="box">${done ? "✓" : ""}</div>
        <div class="text">${resolve(PLAN[currentDay][mealKey])}</div>
      </div>`;
    card.querySelector(".meal-item").onclick = () => toggleMeal(mealKey);
    wrap.appendChild(card);
  });
}
function renderExtras(){
  document.getElementById("extraPsyllium").className = "extra" + (state[currentDay].psyllium ? " on" : "");
  document.getElementById("extraGym").className = "extra" + (state[currentDay].gym ? " on" : "");
}
function renderProgress(){
  const {done,total} = dayProgress(currentDay);
  const pct = Math.round(done/total*100);
  document.getElementById("progFill").style.width = pct + "%";
  document.getElementById("progPct").textContent = pct + "%";
  document.getElementById("progLabel").textContent =
    done === total ? "¡Día completo! 🎉" : `Progreso del día (${done}/${total})`;
}
function renderRecetas(){
  const wrap = document.getElementById("recetasList");
  let html = `<div class="ing-section"><h2>🗓️ Bloques de meal prep</h2>`;
  PREP_BLOCKS.forEach(b => {
    html += `<div class="block-card"><div class="b-title">${b.title}</div><div class="b-sub">${b.sub}</div></div>`;
  });
  html += `</div>`;

  [["prep","🍱 Meal prep (prepara en bloque)","MEAL PREP"],
   ["diario","🥗 Diario / fresco (no preparar antes)","DIARIO"]].forEach(([tag,title,label]) => {
    html += `<div class="ing-section"><h2>${title}</h2>`;
    RECIPES.filter(r => r.tag === tag).forEach(r => {
      const steps = r.steps.map(s => `<li>${s}</li>`).join("");
      html += `<div class="recipe">
        <div class="r-head">${r.name}<span class="r-tag ${r.tag}">${label}</span></div>
        <div class="r-days">${r.days}</div>
        <ol>${steps}</ol>
        <div class="r-note">${r.note}</div>
      </div>`;
    });
    html += `</div>`;
  });
  wrap.innerHTML = html;
}
function renderIngredientes(){
  const wrap = document.getElementById("ingList");
  wrap.innerHTML = "";
  ["Verdura","Fruta","Proteína"].forEach(cat => {
    const keys = Object.keys(INGREDIENTS).filter(k => INGREDIENTS[k].cat === cat);
    if(!keys.length) return;
    const sec = document.createElement("div");
    sec.className = "ing-section";
    sec.innerHTML = `<h2>${cat}</h2>`;
    const box = document.createElement("div");
    box.className = "ing-box";
    keys.forEach(k => {
      const g = INGREDIENTS[k];
      const on = ing[k];
      const alts = g.alts.map(altName).join(" · ");
      const row = document.createElement("div");
      row.className = "ing-row" + (on ? "" : " off");
      row.innerHTML = `
        <div class="ing-info">
          <div class="ing-name">${cap(g.name)}</div>
          <div class="ing-alts">Alternativas: ${alts}</div>
        </div>
        <div class="switch ${on ? "on" : ""}"><div class="knob"></div></div>`;
      row.onclick = () => toggleIngredient(k);
      box.appendChild(row);
    });
    sec.appendChild(box);
    wrap.appendChild(sec);
  });
}
function renderCompras(){
  const wrap = document.getElementById("comprasList");
  const off = Object.keys(INGREDIENTS).filter(k => !ing[k]);

  let html = `<div class="ing-section"><h2>🛒 Falta comprar</h2>`;
  if(off.length === 0){
    html += `<div class="tip">Tienes todo lo de la lista. 🎉</div>`;
  } else {
    const byCat = {};
    off.forEach(k => { const c = INGREDIENTS[k].cat; (byCat[c] = byCat[c] || []).push(k); });
    Object.keys(byCat).forEach(cat => {
      html += `<div class="ing-box">`;
      byCat[cat].forEach(k => {
        const g = INGREDIENTS[k];
        html += `<div class="ing-row"><div class="ing-info"><div class="ing-name">${cap(g.name)}</div><div class="ing-alts">o compra: ${g.alts.map(altName).join(" · ")}</div></div></div>`;
      });
      html += `</div>`;
    });
  }
  html += `</div>`;

  html += `<div class="ing-section"><h2>🧺 Ya tienes (semana pasada)</h2><div class="ing-box">`;
  STOCK.forEach(s => {
    html += `<div class="ing-row stock"><div class="ing-info"><div class="ing-name">${s.name} <span class="muted">${s.qty}</span></div><div class="ing-alts">${s.note}</div></div></div>`;
  });
  html += `</div></div>`;

  html += `<div class="ing-section"><h2>📋 Básicos de siempre</h2><div class="ing-box">`;
  STAPLES.forEach(s => {
    html += `<div class="ing-row"><div class="ing-info"><div class="ing-name">${s}</div></div></div>`;
  });
  html += `</div></div>`;

  wrap.innerHTML = html;
}

function render(){
  renderNav(); renderDots(); renderMeta(); renderMeals(); renderExtras(); renderProgress();
  renderRecetas(); renderIngredientes(); renderCompras();
}

function showView(v){
  const views = {semana:"flex", recetas:"block", ingredientes:"block", compras:"block"};
  Object.keys(views).forEach(key => {
    document.getElementById("view" + key.charAt(0).toUpperCase() + key.slice(1)).style.display = (key === v) ? views[key] : "none";
  });
  document.getElementById("tabSemana").className = v === "semana" ? "active" : "";
  document.getElementById("tabRecetas").className = v === "recetas" ? "active" : "";
  document.getElementById("tabIng").className = v === "ingredientes" ? "active" : "";
  document.getElementById("tabCompras").className = v === "compras" ? "active" : "";
}

function selectDay(k){ currentDay = k; render(); }
function toggleMeal(mealKey){ state[currentDay][mealKey] = !state[currentDay][mealKey]; save(); render(); }
function toggleDaily(key){ state[currentDay][key] = !state[currentDay][key]; save(); render(); }
function toggleIngredient(k){ ing[k] = !ing[k]; saveIng(); render(); }

function resetWeek(){
  if(!confirm("¿Reiniciar el progreso de TODA la semana?")) return;
  DAY_KEYS.forEach(d => state[d] = {desayuno:false,almuerzo:false,merienda:false,cena:false,psyllium:false,gym:false});
  save(); render();
}

currentDay = todayKey();
render();
</script>
</body>
</html>

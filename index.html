<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Plan de Alimentación</title>
<style>
  :root{
    --bg:#f4f6f8;
    --card:#ffffff;
    --ink:#1f2937;
    --muted:#6b7280;
    --accent:#16a34a;
    --accent-soft:#dcfce7;
    --warm:#f59e0b;
    --border:#e5e7eb;
    --done:#9ca3af;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
    font-size:14px;
  }

  /* ---------- Header ---------- */
  header{
    display:flex;
    align-items:center;
    gap:14px;
    padding:10px 16px;
    background:var(--card);
    border-bottom:1px solid var(--border);
  }
  header .title{font-size:17px;font-weight:700;letter-spacing:-.2px;}
  header .subtitle{font-size:11px;color:var(--muted);margin-top:1px;}
  .week-dots{display:flex;gap:6px;margin-left:auto;align-items:center;}
  .week-dots .dot{
    width:26px;height:26px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;color:var(--muted);
    background:#f3f4f6;border:1px solid var(--border);cursor:pointer;
  }
  .week-dots .dot.today{border-color:var(--accent);color:var(--accent);}
  .week-dots .dot.full{background:var(--accent);border-color:var(--accent);color:#fff;}
  .week-dots .dot.partial{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
  .btn-reset{
    border:1px solid var(--border);background:#fff;color:var(--muted);
    border-radius:8px;padding:7px 12px;font-size:12px;font-weight:600;cursor:pointer;
  }
  .btn-reset:active{background:#f3f4f6;}

  /* ---------- Day nav ---------- */
  nav.days{
    display:flex;
    gap:6px;
    padding:8px 16px;
    background:var(--card);
    border-bottom:1px solid var(--border);
    overflow-x:auto;
  }
  nav.days button{
    flex:1;min-width:0;
    border:1px solid var(--border);background:#fff;color:var(--muted);
    border-radius:10px;padding:9px 4px;font-size:12px;font-weight:600;cursor:pointer;
    white-space:nowrap;
  }
  nav.days button.active{background:var(--accent);border-color:var(--accent);color:#fff;}

  /* ---------- Main ---------- */
  main{
    flex:1;
    display:flex;
    flex-direction:column;
    padding:12px 16px;
    gap:10px;
    min-height:0;
  }
  .day-meta{
    display:flex;align-items:center;gap:14px;
    font-size:12px;color:var(--muted);
  }
  .day-meta b{color:var(--ink);font-size:13px;}
  .day-meta .chip{
    background:var(--accent-soft);color:var(--accent);
    padding:3px 10px;border-radius:999px;font-weight:700;font-size:12px;
  }

  .meals{
    flex:1;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    min-height:0;
  }
  .meal-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px;
    display:flex;
    flex-direction:column;
    gap:8px;
    overflow-y:auto;
  }
  .meal-head{
    display:flex;align-items:center;gap:8px;
    font-weight:700;font-size:13px;
  }
  .meal-head .icon{font-size:18px;}
  .meal-item{
    display:flex;align-items:flex-start;gap:10px;
    background:#fafafa;border:1px solid var(--border);border-radius:10px;
    padding:10px;cursor:pointer;user-select:none;
    transition:background .15s;
  }
  .meal-item:active{background:#f0f0f0;}
  .meal-item .box{
    width:22px;height:22px;border-radius:7px;border:2px solid var(--accent);
    flex:0 0 auto;margin-top:1px;
    display:flex;align-items:center;justify-content:center;
    font-size:14px;color:#fff;font-weight:800;transition:background .15s;
  }
  .meal-item.done{opacity:.55;}
  .meal-item.done .text{text-decoration:line-through;color:var(--done);}
  .meal-item.done .box{background:var(--accent);}
  .meal-item .text{font-size:12.5px;line-height:1.35;color:var(--ink);}

  /* ---------- Footer ---------- */
  footer{
    display:flex;align-items:center;gap:14px;
    padding:10px 16px;
    background:var(--card);
    border-top:1px solid var(--border);
  }
  .extra{
    display:flex;align-items:center;gap:8px;
    font-size:12.5px;font-weight:600;cursor:pointer;user-select:none;
    padding:8px 12px;border:1px solid var(--border);border-radius:10px;background:#fff;
  }
  .extra .box{
    width:20px;height:20px;border-radius:6px;border:2px solid var(--warm);
    display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;font-weight:800;
  }
  .extra.on .box{background:var(--warm);}
  .progress-wrap{flex:1;display:flex;flex-direction:column;gap:4px;}
  .progress-wrap .label{font-size:11px;color:var(--muted);font-weight:600;}
  .bar{height:10px;background:#eef0f2;border-radius:999px;overflow:hidden;}
  .bar .fill{height:100%;background:linear-gradient(90deg,#22c55e,#16a34a);border-radius:999px;transition:width .3s;}
  .pct{font-size:13px;font-weight:700;color:var(--accent);min-width:44px;text-align:right;}

  @media (max-width:760px){
    .meals{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>
<body>
  <header>
    <div>
      <div class="title">🥗 Plan de Alimentación</div>
      <div class="subtitle">Seguimiento semanal</div>
    </div>
    <div class="week-dots" id="weekDots"></div>
    <button class="btn-reset" onclick="resetWeek()">↺ Reiniciar semana</button>
  </header>

  <nav class="days" id="dayNav"></nav>

  <main>
    <div class="day-meta" id="dayMeta"></div>
    <div class="meals" id="meals"></div>
  </main>

  <footer>
    <div class="extra" id="extraPsyllium" onclick="toggleDaily('psyllium')">
      <div class="box">✓</div>
      <span>💧 1 cdta psyllium en agua</span>
    </div>
    <div class="extra" id="extraGym" onclick="toggleDaily('gym')">
      <div class="box">✓</div>
      <span>🏋️ Extra gimnasio: 1 tortilla + 20 g maní</span>
    </div>
    <div class="progress-wrap">
      <div class="label" id="progLabel">Progreso del día</div>
      <div class="bar"><div class="fill" id="progFill" style="width:0%"></div></div>
    </div>
    <div class="pct" id="progPct">0%</div>
  </footer>

<script>
const MEAL_META = {
  desayuno: {icon:"🌅", name:"Desayuno"},
  almuerzo: {icon:"☀️", name:"Almuerzo"},
  merienda: {icon:"🍎", name:"Merienda"},
  cena:     {icon:"🌙", name:"Cena"}
};
const MEAL_ORDER = ["desayuno","almuerzo","merienda","cena"];

const PLAN = {
  lunes: {
    n:"Lun",
    meta:{kcal:"~1307 kcal", prot:"~130 g proteína"},
    desayuno:"Omelette de 1 huevo + 3 claras con ½ taza de espinaca y 30 g de queso tierno, en 1 cdta de aceite",
    almuerzo:"130 g de pollo a la plancha, ensalada grande con 2 cdtas de aceite de oliva, ¼ taza de frijoles",
    merienda:"Yogur griego natural 2% con 1 cda de chía y 20 g de almendras",
    cena:"130 g de tilapia al horno con 1 taza de brócoli y 2 cdtas de aceite"
  },
  martes: {
    n:"Mar",
    meta:{kcal:"~1260 kcal", prot:"~110 g proteína"},
    desayuno:"Yogur griego natural 2% con chía, linaza, ½ taza de fresas y 2 mitades de nuez",
    almuerzo:"Ensalada de atún (1 lata en agua, bajo sodio) con ¼ de aguacate, pepino y 2 cdtas de aceite",
    merienda:"1 huevo duro + 20 g de maní sin sal",
    cena:"130 g de pollo salteado con vainicas y coliflor en 2 cdtas de aceite"
  },
  miercoles: {
    n:"Mié",
    meta:{kcal:"~1372 kcal", prot:"~125 g proteína"},
    desayuno:"1 huevo + 3 claras revueltos con hongos, 1 tortilla de maíz, 1 cdta de aceite",
    almuerzo:"130 g de pollo, ¼ taza de lentejas, ensalada con 2 cdtas de aceite",
    merienda:"Yogur griego natural 2% con 1 cda de linaza, 1 cda de chía y 20 g de almendras",
    cena:"120 g de salmón con coliflor asada y 1 cdta de aceite"
  },
  jueves: {
    n:"Jue",
    meta:{kcal:"~1219 kcal", prot:"~98 g proteína"},
    desayuno:"Yogur griego natural 2% con chía, ½ taza de fresas y 20 g de almendras",
    almuerzo:"150 g de posta de cerdo sin grasa en picadillo de chayote, repollo con limón, 2 cdtas de aceite",
    merienda:"20 g de maní sin sal + 30 g de queso tierno",
    cena:"1 huevo + 4 claras en tortilla española sin papa, con brócoli y 2 cdtas de aceite"
  },
  viernes: {
    n:"Vie",
    meta:{kcal:"~1274 kcal", prot:"~123 g proteína"},
    desayuno:"1 huevo + 3 claras con ½ taza de espinaca y 30 g de queso tierno, 1 cdta de aceite",
    almuerzo:"Ensalada de atún con ¼ taza de frijoles y 2 cdtas de aceite",
    merienda:"Yogur griego natural 2% con chía y 2 mitades de nuez",
    cena:"130 g de pollo con coliflor y vainicas en 2 cdtas de aceite"
  },
  sabado: {
    n:"Sáb",
    meta:{kcal:"~1308 kcal", prot:"~113 g proteína"},
    desayuno:"Yogur griego natural 2% con linaza, chía, ½ taza de fresas y 2 mitades de nuez",
    almuerzo:"130 g de pollo, ensalada con ¼ de aguacate y 2 cdtas de aceite",
    merienda:"1 huevo duro + 20 g de almendras",
    cena:"130 g de tilapia, chayote y repollo salteados en 2 cdtas de aceite"
  },
  domingo: {
    n:"Dom",
    meta:{kcal:"~1288 kcal", prot:"~118 g proteína"},
    desayuno:"1 huevo + 3 claras con hongos, 1 tortilla de maíz, 1 cdta de aceite",
    almuerzo:"130 g de posta de cerdo sin grasa, ¼ taza de lentejas, repollo con 2 cdtas de aceite",
    merienda:"Yogur griego natural 2% con chía y 20 g de almendras",
    cena:"100 g de pollo con brócoli y 2 cdtas de aceite"
  }
};

const DAY_KEYS = ["lunes","martes","miercoles","jueves","viernes","sabado","domingo"];
const CORE_COUNT = 5; // 4 comidas + psyllium
const STORE_KEY = "plan-alimentacion-v2";

let currentDay = DAY_KEYS[0];
let state = load();

function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  const s = {};
  DAY_KEYS.forEach(d => s[d] = {desayuno:false,almuerzo:false,merienda:false,cena:false,psyllium:false,gym:false});
  return s;
}

function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }

function todayKey(){
  const i = (new Date().getDay() + 6) % 7; // 0=lunes ... 6=domingo
  return DAY_KEYS[i];
}

function dayProgress(d){
  const s = state[d];
  let done = 0;
  MEAL_ORDER.forEach(m => { if(s[m]) done++; });
  if(s.psyllium) done++;
  return {done, total:CORE_COUNT};
}

function renderNav(){
  const nav = document.getElementById("dayNav");
  nav.innerHTML = "";
  DAY_KEYS.forEach(k => {
    const b = document.createElement("button");
    b.textContent = PLAN[k].n;
    b.className = k === currentDay ? "active" : "";
    b.onclick = () => selectDay(k);
    nav.appendChild(b);
  });
}

function renderDots(){
  const wrap = document.getElementById("weekDots");
  wrap.innerHTML = "";
  DAY_KEYS.forEach(k => {
    const d = document.createElement("div");
    d.className = "dot";
    d.textContent = PLAN[k].n[0];
    const {done,total} = dayProgress(k);
    if(done === total) d.classList.add("full");
    else if(done > 0) d.classList.add("partial");
    if(k === todayKey()) d.classList.add("today");
    d.onclick = () => selectDay(k);
    wrap.appendChild(d);
  });
}

function renderMeta(){
  const m = PLAN[currentDay].meta;
  document.getElementById("dayMeta").innerHTML =
    `<span class="chip">${PLAN[currentDay].n}</span>` +
    `<span><b>${m.kcal}</b></span>` +
    `<span><b>${m.prot}</b></span>`;
}

function renderMeals(){
  const wrap = document.getElementById("meals");
  wrap.innerHTML = "";
  MEAL_ORDER.forEach(mealKey => {
    const card = document.createElement("div");
    card.className = "meal-card";
    const done = state[currentDay][mealKey];
    card.innerHTML = `
      <div class="meal-head"><span class="icon">${MEAL_META[mealKey].icon}</span>${MEAL_META[mealKey].name}</div>
      <div class="meal-item ${done ? "done" : ""}" data-meal="${mealKey}">
        <div class="box">${done ? "✓" : ""}</div>
        <div class="text">${PLAN[currentDay][mealKey]}</div>
      </div>`;
    card.querySelector(".meal-item").onclick = () => toggleMeal(mealKey);
    wrap.appendChild(card);
  });
}

function renderExtras(){
  document.getElementById("extraPsyllium").className = "extra" + (state[currentDay].psyllium ? " on" : "");
  document.getElementById("extraGym").className = "extra" + (state[currentDay].gym ? " on" : "");
}

function renderProgress(){
  const {done,total} = dayProgress(currentDay);
  const pct = Math.round(done/total*100);
  document.getElementById("progFill").style.width = pct + "%";
  document.getElementById("progPct").textContent = pct + "%";
  document.getElementById("progLabel").textContent =
    done === total ? "¡Día completo! 🎉" : `Progreso del día (${done}/${total})`;
}

function render(){
  renderNav(); renderDots(); renderMeta(); renderMeals(); renderExtras(); renderProgress();
}

function selectDay(k){
  currentDay = k;
  render();
}

function toggleMeal(mealKey){
  state[currentDay][mealKey] = !state[currentDay][mealKey];
  save(); render();
}

function toggleDaily(key){
  state[currentDay][key] = !state[currentDay][key];
  save(); render();
}

function resetWeek(){
  if(!confirm("¿Reiniciar el progreso de TODA la semana?")) return;
  DAY_KEYS.forEach(d => state[d] = {desayuno:false,almuerzo:false,merienda:false,cena:false,psyllium:false,gym:false});
  save(); render();
}

currentDay = todayKey();
render();
</script>
</body>
</html>
